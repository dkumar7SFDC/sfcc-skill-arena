name: Deploy Apps Script

# Fires on every merge/push to main that touches the Apps Script sources.
on:
  push:
    branches: [main]
    paths:
      - 'appscript/**'
      - 'src/seed/questions.json'
      - '.github/workflows/deploy-appscript.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-appscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install clasp
        run: |
          npm install -g @google/clasp@2.4.2
          echo "clasp $(clasp --version)"
          echo "node $(node -v)"
          # Install jq for the credentials-shape fix below
          sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Sanity-check secrets (redacted)
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          mask() { local v="$1"; local n=${#v}; if [ "$n" -le 10 ]; then echo "(len=$n)"; else echo "${v:0:6}…${v: -4} (len=$n)"; fi; }
          echo "APPS_SCRIPT_ID            : $(mask "$APPS_SCRIPT_ID")"
          echo "APPS_SCRIPT_DEPLOYMENT_ID : $(mask "$APPS_SCRIPT_DEPLOYMENT_ID")"
          echo "CLASPRC_JSON length       : ${#CLASPRC_JSON} bytes"
          if echo "$APPS_SCRIPT_ID" | grep -q "^AKfyc"; then
            echo "::warning::APPS_SCRIPT_ID starts with AKfyc — looks like a deployment ID, not a scriptId. These are different!"
          fi

      - name: Rebuild Questions.gs from questions.json
        run: node appscript/build_questions_gs.mjs

      - name: Write clasp credentials (handles both legacy & modern shapes)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::CLASPRC_JSON secret is missing."
            exit 1
          fi
          # The secret might be either shape depending on when you ran `clasp login`:
          #   - modern wrapper:  {"token":{access_token,refresh_token,...}, "oauth2ClientSettings":{...}, "isLocalCreds":false}
          #   - legacy flat:     {access_token, refresh_token, scope, token_type, id_token, expiry_date}
          # clasp 2.4.2's webapp code path needs the flat shape, written to BOTH
          # ~/.clasprc.json (global) AND the project's local .clasprc.json.
          printf '%s' "$CLASPRC_JSON" > /tmp/raw.json
          if jq -e '.token.access_token' /tmp/raw.json >/dev/null 2>&1; then
            echo "Detected modern (nested) shape — flattening .token"
            jq '.token' /tmp/raw.json > /tmp/flat.json
          elif jq -e '.access_token' /tmp/raw.json >/dev/null 2>&1; then
            echo "Detected legacy (flat) shape — using as-is"
            cp /tmp/raw.json /tmp/flat.json
          else
            echo "::error::CLASPRC_JSON doesn't contain an access_token (checked both .token.access_token and .access_token)."
            echo "First 40 chars (redacted keys): $(jq 'with_entries(.value = "***")' /tmp/raw.json | head -c 200)"
            exit 1
          fi
          # Write both locations so clasp finds it regardless of which path it takes.
          cp /tmp/flat.json "$HOME/.clasprc.json"
          cp /tmp/flat.json appscript/.clasprc.json
          echo "Wrote ~/.clasprc.json and appscript/.clasprc.json"

      - name: Write .clasp.json for this project
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          if [ -z "$SCRIPT_ID" ]; then
            echo "::error::APPS_SCRIPT_ID secret is missing."
            exit 1
          fi
          cat > appscript/.clasp.json <<EOF
          {
            "scriptId": "$SCRIPT_ID",
            "rootDir": "."
          }
          EOF

      - name: Push sources to Apps Script
        working-directory: appscript
        run: clasp push -f

      - name: Deploy webapp
        working-directory: appscript
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -n "$DEPLOYMENT_ID" ]; then
            echo "Updating stable deployment $DEPLOYMENT_ID"
            clasp deploy -i "$DEPLOYMENT_ID" -d "ci $GITHUB_SHA"
          else
            echo "APPS_SCRIPT_DEPLOYMENT_ID not set — creating a new deployment (new URL each run)."
            clasp deploy -d "ci $GITHUB_SHA"
          fi
